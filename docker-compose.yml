services:
  postgres:
    image: postgres:16-alpine
    container_name: sfs-postgres
    restart: always
    environment:
      POSTGRES_USER: sfs_user
      POSTGRES_PASSWORD: sfs_secure_pass_2025
      POSTGRES_DB: sfs_portail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfs_user -d sfs_portail"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sfs-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-qualios:
    build:
      context: .
      dockerfile: apps/mock-qualios/Dockerfile
    container_name: sfs-mock-qualios
    restart: always
    ports:
      - "4010:4010"
    environment:
      PORT: 4010
      API_KEY: qualios_live_secret_key_sfs_demo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4010/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sfs-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-qualios:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://sfs_user:sfs_secure_pass_2025@postgres:5432/sfs_portail?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-1
      S3_BUCKET: sfs-portal-attachments
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: super-secret-jwt-key-for-sfs-portal-at-least-32-chars-long!
      QUALIOS_ADAPTER: rest
      QUALIOS_BASE_URL: http://mock-qualios:4010/api/v1
      QUALIOS_API_KEY: qualios_live_secret_key_sfs_demo
      QUALIOS_FILE_EXCHANGE_PATH: /data/qualios_exchange
      EMAIL_SIMULATION_MODE: "true"
      ANTIVIRUS_ENABLED: "true"
      ANTIVIRUS_MOCK_MODE: "true"
    volumes:
      - qualios_exchange:/data/qualios_exchange
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sfs-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  qualios_exchange:
