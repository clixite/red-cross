name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfs_user
          POSTGRES_PASSWORD: sfs_secure_pass_2025
          POSTGRES_DB: sfs_portail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test -- --coverage
        env:
          DATABASE_URL: postgresql://sfs_user:sfs_secure_pass_2025@localhost:5432/sfs_portail?schema=public
          JWT_SECRET: test-secret-key-for-ci-running-purposes-only!

      - name: Build all packages & apps
        run: npm run build
