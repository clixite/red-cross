server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sécurité : en-têtes CSP stricts et anti-sniffing
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:4000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Toujours revalider l'index.html pour ne jamais servir une version obsolète
        # (le nom des assets hashés change à chaque build -> cache long ci-dessous)
        add_header Cache-Control "no-cache" always;
    }

    # Assets buildés (noms hashés) : cache immuable long
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Proxy API backend
    # NB: nom de conteneur explicite (sfs-backend) plutôt que "backend" pour éviter
    # toute ambiguïté DNS quand le conteneur est rattaché à plusieurs réseaux Docker
    # (d'autres stacks exposent un alias "backend" sur le réseau proxy partagé).
    location /api/ {
        proxy_pass http://sfs-backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
