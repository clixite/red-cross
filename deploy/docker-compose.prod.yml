# -----------------------------------------------------------------------------
# Portail Clients B2B - Service du Sang (Croix-Rouge de Belgique)
# Composition de PRODUCTION pour le serveur clixite-prod.cloud (76.13.46.55)
#
# Usage :
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Différences avec docker-compose.yml (dev local) :
#   - Les ports hôte sont liés à 127.0.0.1 uniquement (accès ops, pas d'exposition publique)
#   - Le conteneur frontend est rattaché au réseau externe "proxy" pour Traefik
#   - Les secrets sont injectés via .env (voir .env.prod.example)
# -----------------------------------------------------------------------------
name: redcross

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfs-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sfs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sfs_portail}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfs_user} -d ${POSTGRES_DB:-sfs_portail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sfs-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-qualios:
    build:
      context: .
      dockerfile: apps/mock-qualios/Dockerfile
    container_name: sfs-mock-qualios
    restart: always
    ports:
      - "127.0.0.1:4010:4010"
    environment:
      PORT: 4010
      API_KEY: ${QUALIOS_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4010/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sfs-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-qualios:
        condition: service_healthy
    ports:
      - "127.0.0.1:4002:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-https://redcross.clixite-prod.cloud}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfs_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sfs_portail}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-1
      S3_BUCKET: ${S3_BUCKET:-sfs-portal-attachments}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET}
      QUALIOS_ADAPTER: rest
      QUALIOS_BASE_URL: http://mock-qualios:4010/api/v1
      QUALIOS_API_KEY: ${QUALIOS_API_KEY}
      QUALIOS_FILE_EXCHANGE_PATH: /data/qualios_exchange
      EMAIL_SIMULATION_MODE: "true"
      ANTIVIRUS_ENABLED: "true"
      ANTIVIRUS_MOCK_MODE: "true"
    volumes:
      - qualios_exchange:/data/qualios_exchange
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sfs-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:80"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  qualios_exchange:

networks:
  proxy:
    external: true
